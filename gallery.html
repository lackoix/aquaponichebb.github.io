<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Aquaponics Club</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        
        /* Header */
        header { 
            background-color: #1b4332; 
            padding: 20px; 
            text-align: center; 
            width: 100%;
            box-sizing: border-box;
        }
        header a { 
            color: #d8f3dc; 
            text-decoration: none; 
            font-size: 1.5rem; 
            font-weight: bold; 
        }

        /* Folder Grid */
        .folder-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #ddd; cursor: pointer; }
        
        .ss-container { height: 200px; position: relative; border-radius: 8px; overflow: hidden; background: #eee; }
        .slide { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s; }
        .slide.active { opacity: 1; }

        /* Lightbox - Grid Collage */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; padding: 60px 20px; overflow-y: auto; box-sizing: border-box; }
        #lightbox-content { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
        #lightbox-content img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; cursor: pointer; }
        .close { position: fixed; top: 20px; right: 20px; color: white; font-size: 40px; cursor: pointer; z-index: 1001; }

        /* --- Easter Egg Animation --- */
        @keyframes swayDance {
            0% { transform: translate(-50%, -50%) rotate(-15deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(15deg) scale(1.1); }
            100% { transform: translate(-50%, -50%) rotate(-15deg) scale(1); }
        }
        .dancing-egg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 300px;
            max-height: 300px;
            z-index: 9999;
            pointer-events: auto;
            cursor: pointer;
            animation: swayDance 1.2s ease-in-out infinite;
            box-shadow: none;
            border-radius: 15px;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html">← Back to Home</a>
    </header>

    <div class="folder-grid">
        <!-- Card 1: Activities -->
        <div class="card" onclick="openDriveFolder('activities')">
            <h2>📂 Club Activities</h2>
            <div class="ss-container" id="ss1">
                <p style="text-align: center; line-height: 200px; color: #888; margin: 0;">Loading images...</p>
            </div>
        </div>

        <!-- Card 2: Members -->
        <div class="card" onclick="openDriveFolder('members')">
            <h2>👥 Members & Team</h2>
            <div class="ss-container" id="ss2">
                <p style="text-align: center; line-height: 200px; color: #888; margin: 0;">Loading images...</p>
            </div>
        </div>

        <!-- Card 3: System -->
        <div class="card" onclick="openDriveFolder('system')">
            <h2>🛠️ System & Tech</h2>
            <div class="ss-container" id="ss3">
                <p style="text-align: center; line-height: 200px; color: #888; margin: 0;">Loading images...</p>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" onclick="this.style.display='none'">
        <span class="close">&times;</span>
        <div id="lightbox-content"></div>
    </div>

    <script>
        // ================= CONFIGURATION =================
        const API_KEY = 'AIzaSyB0fIi4GLS5F5Z20FJuf2JO29x2nU5rrSw'; // Remember to restrict this key in Google Cloud Console!

        const DRIVE_FOLDERS = {
            activities: '1789a81odqFd4iL5u3QBNP97JjbZBDdHdq',  // Club Activities Folder
            members:    '1Xm7k88iXb93bKLOrVJb7H5Bvxg4dXmcg', // Members Folder
            system:     '1Lfg85X814iHl3_pQeFeFyL9XuHLTgdV1'  // System and Tech Folder
        };
        // =================================================

        // 1. Core Fetcher to grab image URLs from any Drive Folder ID
        async function fetchDriveImages(folderId) {
            const url = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+mimeType+contains+'image/'&fields=files(id,name)&key=${API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.files && data.files.length > 0) {
                    return data.files.map(file => `https://drive.google.com/thumbnail?id=${file.id}&sz=w1200`);
                }
            } catch (error) {
                console.error('Error fetching Drive folder:', error);
            }
            return [];
        }

        // 2. Load Google Drive images directly into the Card Preview Slideshows
        async function loadCardSlideshows() {
            const categories = [
                { key: 'activities', ssId: 'ss1' },
                { key: 'members', ssId: 'ss2' },
                { key: 'system', ssId: 'ss3' }
            ];

            for (const cat of categories) {
                const images = await fetchDriveImages(DRIVE_FOLDERS[cat.key]);
                const container = document.getElementById(cat.ssId);

                if (container && images.length > 0) {
                    container.innerHTML = images.map((src, index) => 
                        `<img class="slide ${index === 0 ? 'active' : ''}" src="${src}">`
                    ).join('');

                    startSS(cat.ssId);
                } else if (container) {
                    container.innerHTML = '<p style="text-align: center; line-height: 200px; color: #888; margin: 0;">No preview images</p>';
                }
            }
        }

        // 3. Slideshow Rotation Engine
        function startSS(id) {
            let container = document.getElementById(id);
            if (!container) return;
            let slides = container.querySelectorAll('.slide');
            if (slides.length <= 1) return;

            let i = 0;
            setInterval(() => {
                slides[i].classList.remove('active');
                i = (i + 1) % slides.length;
                slides[i].classList.add('active');
            }, 3000);
        }

        // 4. Open Lightbox on Card Click (Google Drive API)
        async function openDriveFolder(categoryKey) {
            const folderId = DRIVE_FOLDERS[categoryKey];
            const container = document.getElementById('lightbox-content');
            
            container.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1; font-size: 1.2rem;">Loading pictures from Google Drive...</p>';
            document.getElementById('lightbox').style.display = 'block';

            const imageUrls = await fetchDriveImages(folderId);

            if (imageUrls.length > 0) {
                container.innerHTML = imageUrls.map(src => `<img src="${src}" onclick="event.stopPropagation()">`).join('');
            } else {
                container.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1;">No images found in this Google Drive folder yet!</p>';
            }
        }

        // Initialize slideshows when page DOM is ready
        window.addEventListener('DOMContentLoaded', loadCardSlideshows);

        /* --- Combined Hybrid Easter Egg Trigger --- */
        const targetSequence = ['l', 'a', 'b', 'u', 'h', 'e', 'e'];
        let currentSequence = [];

        // 1. Desktop Track: Keyboard Sequence Matcher
        window.addEventListener("keydown", (e) => {
            const key = e.key.toLowerCase(); 
            currentSequence.push(key);
            
            if (currentSequence.length > targetSequence.length) {
                currentSequence.shift();
            }

            if (JSON.stringify(currentSequence) === JSON.stringify(targetSequence)) {
                triggerEasterEgg();
                currentSequence = []; 
            }
        });

        // 2. Mobile Track: Background Press-and-Hold (3 Seconds)
        let pressTimer;
        window.addEventListener("mousedown", startPress);
        window.addEventListener("touchstart", startPress, { passive: true });
        window.addEventListener("mouseup", cancelPress);
        window.addEventListener("touchend", cancelPress);

        function startPress(e) {
            if (e.target.closest('.card') || e.target.closest('header') || e.target.closest('#lightbox')) return;
            
            pressTimer = window.setTimeout(() => {
                triggerEasterEgg();
            }, 3000); 
        }

        function cancelPress() {
            clearTimeout(pressTimer);
        }

        // Execution Logic
        function triggerEasterEgg() {
            if (document.getElementById("easter-egg-pic")) return;

            let img = document.createElement("img");
            img.src = "https://i.imgur.com/ZsOgoZP.png"; 
            img.className = "dancing-egg";
            img.id = "easter-egg-pic";
            img.title = "Click me to dismiss!";

            img.addEventListener("click", () => {
                img.remove();
            });

            document.body.appendChild(img);
        }
    </script>
</body>
</html>
