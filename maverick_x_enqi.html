<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maverick x Enqi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 1rem;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            max-width: 1000px;
            width: 100%;
        }

        .image-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-wrapper img {
            width: 100%;
            max-width: 380px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            object-fit: cover;
            border: 2px solid #334155;
            transition: transform 0.3s ease;
        }

        .image-wrapper img:hover {
            transform: scale(1.03);
        }

        .divider-x {
            font-size: 3rem;
            font-weight: 900;
            color: #38bdf8;
            text-transform: uppercase;
            user-select: none;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                gap: 1.5rem;
            }

            .image-wrapper img {
                max-width: 280px;
            }

            .divider-x {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- First Picture -->
        <div class="image-wrapper">
            <img src="https://i.imgur.com/rfKKEzs.jpeg" alt="Maverick">
        </div>

        <!-- X Separator -->
        <div class="divider-x">X</div>

        <!-- Second Picture -->
        <div class="image-wrapper">
            <img src="https://i.imgur.com/BayZvrL.jpeg" alt="Enqi">
        </div>
    </div>

</body>
</html>
